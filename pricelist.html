<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="nail.PNG">

    <title>Merci - Price List</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            background-color: #FFF0F2;
        }
    </style>
</head>

<body class="min-h-screen">

   
    
    <header class="bg-[#2A0815] border-b border-[#D4AF37]/30 sticky top-0 z-40 backdrop-blur-md shadow-lg">
    <div class="flex items-center gap-3">

        <img
            id="logo"
            src="nail.PNG"
            alt="Merci Logo"
            class="w-10 h-10 sm:w-12 sm:h-12 rounded-full object-cover cursor-pointer">

        <div class="flex flex-col justify-center">
            <h1 class="text-4xl font-serif font-bold text-[#D4AF37] leading-none">
                merci
            </h1>

            <p class="text-sm text-[#D4AF37] mt-1">
                by Marry Joubran
            </p>
        </div>

    </div>

    <div class="flex items-center space-x-2 bg-[#441122] p-1 rounded-xl border border-pink-900/40">

        <a href="index.html" class="px-3.5 py-1.5 rounded-lg text-xs font-bold transition-all duration-200 flex items-center space-x-1.5 text-pink-200 hover:text-white">
            <i class="fa-solid fa-user"></i>
            <span>Client Booking</span>
        </a>

        <a href="pricelist.html" class="px-3.5 py-1.5 rounded-lg text-xs font-bold transition-all duration-200 flex items-center space-x-1.5 text-pink-200 hover:text-white">
            <i class="fa-solid fa-tags"></i>
            <span>Price List</span>
        </a>

        <a href="feedback.html" class="px-3.5 py-1.5 rounded-lg text-xs font-bold transition-all duration-200 flex items-center space-x-1.5 text-pink-200 hover:text-white">
            <i class="fa-solid fa-heart"></i>
            <span>Feedback</span>
        </a>

        <a href="policies.html" class="px-3.5 py-1.5 rounded-lg text-xs font-bold transition-all duration-200 flex items-center space-x-1.5 text-pink-200 hover:text-white">
            <i class="fa-solid fa-file-contract mr-1"></i>
            Policies
        </a>

        <a href="contact.html" class="px-3.5 py-1.5 rounded-lg text-xs font-bold transition-all duration-200 flex items-center space-x-1.5 text-pink-200 hover:text-white">
            <i class="fa-solid fa-address-book mr-1"></i>
            Contact
        </a>

    </div>
</header>


    
    <main class="max-w-5xl mx-auto px-4 py-8">

        <h2 class="text-center text-3xl font-serif font-bold text-[#2A0815] mb-8">
            Price List
        </h2>

        <div class="bg-white rounded-2xl shadow-lg p-4">

            <img
                src="Screenshot 2026-08-08 at 21.47.28.png"
                alt="Merci Nail Services Price List"
                class="w-full h-auto rounded-xl">

        </div>

    </main>
<script>
const currentPage = window.location.pathname.split("/").pop() || "index.html";

document.querySelectorAll("header a, header button").forEach(link => {
    const page = link.getAttribute("href") || link.dataset.page;

    if (page === currentPage) {
        link.classList.remove("text-pink-200", "hover:text-white");
        link.classList.add("bg-[#D4AF37]", "text-[#2A0815]", "shadow-md");
    }
});
</script>
</body>

</html>
